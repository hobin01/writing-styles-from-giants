name: Foundation

on:
  pull_request:
  push:
    branches: [main, release, 'release/**']

permissions:
  contents: read

jobs:
  foundation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Run unit tests
        run: python3 -m unittest discover -s tests -v
      - name: Check repository
        run: python3 scripts/check_repository.py
      - name: Check tracked source whitespace
        run: git diff --check "$(git hash-object -t tree /dev/null)" HEAD
      - name: Install and verify the wheel
        run: |
          python -m pip wheel --no-deps --wheel-dir "$RUNNER_TEMP/dist" .
          python -m pip install --no-index "$RUNNER_TEMP"/dist/*.whl
          cd "$RUNNER_TEMP"
          wsg install --host codex
          wsg install --host pi --global
          diff -r .agents/skills/wsg "$HOME/.pi/agent/skills/wsg"
          diff -r "$GITHUB_WORKSPACE/skills" .agents/skills/wsg/.catalog/skills
          diff -r "$GITHUB_WORKSPACE/commands" .agents/skills/wsg/.catalog/commands
          test "$(wsg --version)" = "$(cat "$GITHUB_WORKSPACE/VERSION")"
      - name: Install offline from the tagged-source layout
        working-directory: ${{ runner.temp }}
        run: |
          git -C "$GITHUB_WORKSPACE" archive --format=zip --prefix=source/ --output="$RUNNER_TEMP/source.zip" HEAD
          python -m zipfile -e source.zip .
          python -I -S source/install.py install --host claude
          diff -r .agents/skills/wsg .claude/skills/wsg
          python -I -S source/install.py install --host claude
          python -I -S "$GITHUB_WORKSPACE/install.py" install --link --host opencode
          test .opencode/skills/wsg -ef "$GITHUB_WORKSPACE/.agents/skills/wsg"
          if python -I -S source/install.py install --link --host opencode; then exit 1; fi
