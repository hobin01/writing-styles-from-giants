name: Draft source release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: source-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  source-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Validate release
        run: |
          python3 -m unittest discover -s tests -v
          python3 scripts/check_repository.py --tag "$RELEASE_TAG"
          git diff --check "$(git hash-object -t tree /dev/null)" HEAD
          test "$(git rev-parse HEAD)" = "$(git rev-parse refs/remotes/origin/main)"
      - name: Build tracked source archive
        run: |
          archive="writing-styles-from-giants-${RELEASE_TAG}.tar.gz"
          mkdir -p "$RUNNER_TEMP/source-release"
          git archive --format=tar.gz --prefix="writing-styles-from-giants-${RELEASE_TAG}/" --output="$RUNNER_TEMP/source-release/$archive" HEAD
          cd "$RUNNER_TEMP/source-release"
          sha256sum "$archive" > "$archive.sha256"
      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          archive="writing-styles-from-giants-${RELEASE_TAG}.tar.gz"
          gh release create "$RELEASE_TAG" \
            "$RUNNER_TEMP/source-release/$archive" \
            "$RUNNER_TEMP/source-release/$archive.sha256" \
            --draft --verify-tag --generate-notes --title "$RELEASE_TAG"
