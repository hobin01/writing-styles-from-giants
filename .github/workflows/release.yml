name: Draft release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: source-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  source-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Validate release
        run: |
          python3 -m unittest discover -s tests -v
          python3 scripts/check_repository.py --tag "$RELEASE_TAG"
          git diff --check "$(git hash-object -t tree /dev/null)" HEAD
          test "$(git rev-parse HEAD)" = "$(git rev-parse refs/remotes/origin/main)"
      - name: Build release assets
        run: |
          archive="writing-styles-from-giants-${RELEASE_TAG}.tar.gz"
          mkdir -p "$RUNNER_TEMP/source-release"
          git archive --format=tar.gz --prefix="writing-styles-from-giants-${RELEASE_TAG}/" --output="$RUNNER_TEMP/source-release/$archive" HEAD
          python -m pip wheel --no-deps --wheel-dir "$RUNNER_TEMP/source-release" .
          cd "$RUNNER_TEMP/source-release"
          wheel="writing_styles_from_giants-${RELEASE_TAG#v}-py3-none-any.whl"
          bundle="wsg-offline-$RELEASE_TAG"
          stage="$RUNNER_TEMP/offline-bundle"
          mkdir -p "$stage"
          unzip -q "$wheel" 'wsg/*' -d "$stage/$bundle"
          cp "$GITHUB_WORKSPACE/docs/OFFLINE.md" "$stage/$bundle/README.md"
          printf 'from wsg import main\n\nmain()\n' > "$stage/$bundle/install.py"
          (cd "$stage" && python -m zipfile -c "$RUNNER_TEMP/source-release/$bundle.zip" "$bundle")
          python -m zipfile -e "$bundle.zip" "$RUNNER_TEMP/offline-check"
          mkdir "$RUNNER_TEMP/offline-check/project"
          (
            cd "$RUNNER_TEMP/offline-check/project"
            test "$(python -S "../$bundle/install.py" --version)" = "${RELEASE_TAG#v}"
            python -S "../$bundle/install.py" install --host codex
            diff -r "$stage/$bundle/wsg/payload" .agents/skills/wsg
          )
          sha256sum "$archive" "$wheel" "$bundle.zip" > SHA256SUMS
      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release create "$RELEASE_TAG" "$RUNNER_TEMP"/source-release/* \
            --draft --verify-tag --generate-notes --title "$RELEASE_TAG"
