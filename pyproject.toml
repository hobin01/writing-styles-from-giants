[build-system]
requires = ["hatchling==1.33.0"]
build-backend = "hatchling.build"

[project]
name = "writing-styles-from-giants"
dynamic = ["version"]
description = "Install the WSG writing methods in your agent's skills directory."
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE", "THIRD_PARTY_NOTICES.md"]

[project.scripts]
wsg = "wsg:main"

[tool.hatch.version]
path = "VERSION"
pattern = '^(?P<version>\S+)$'

[tool.hatch.build.targets.wheel]
only-include = ["src/wsg", "skills", "commands", ".agents/skills/wsg/agents"]

[tool.hatch.build.targets.wheel.sources]
"src/wsg" = "wsg"
"skills" = "wsg/payload/.catalog/skills"
"commands" = "wsg/payload/.catalog/commands"
".agents/skills/wsg/agents" = "wsg/payload/agents"

[tool.hatch.build.targets.wheel.force-include]
"VERSION" = "wsg/payload/VERSION"
"LICENSE" = "wsg/payload/LICENSE"
"THIRD_PARTY_NOTICES.md" = "wsg/payload/THIRD_PARTY_NOTICES.md"
